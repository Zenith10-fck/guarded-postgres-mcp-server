services:
  postgres:
    image: postgres:16-alpine
    container_name: guarded-mcp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guarded_demo
    ports:
      # Mapped to a non-default host port so this doesn't collide with any
      # Postgres you might already have running locally on 5432.
      - "55432:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
      - guarded-mcp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  guarded-mcp-data:
